name: Refresh app release data

# Keeps the version, size, date, checksum and download URL on /apps in sync
# with the GitHub Releases they come from, so the page never advertises a
# stale build. Every six hours, so a release published in the evening is on
# the page the same night rather than the next morning.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the APPS block in apps/index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_app_releases.py

      - name: Commit if anything moved
        id: commit
        run: |
          if git diff --quiet -- apps/index.html; then
            echo "release data already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/index.html
          git commit -m "chore: refresh app release data on /apps"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # The commit above cannot trigger the deploy workflow on its own — pushes
  # made with GITHUB_TOKEN never fire another workflow — so a refreshed page
  # would sit in the repo and never reach the bucket. Call the deploy here.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-arvan.yml
    secrets: inherit
