<link rel="preload" href="/assets/fonts/vazirmatn-arabic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Vazirmatn';font-style:normal;font-weight:300 900;font-display:swap;
  src:url('/assets/fonts/vazirmatn-arabic.woff2') format('woff2');
  unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC;}
@font-face{font-family:'Vazirmatn';font-style:normal;font-weight:300 900;font-display:swap;
  src:url('/assets/fonts/vazirmatn-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F;}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400 700;font-display:swap;
  src:url('/assets/fonts/spacegrotesk-latin.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0066FF;--purple:#7C3AED;--muted:rgba(255,255,255,.55);--glass:rgba(255,255,255,.08);--glass-border:rgba(255,255,255,.12)}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;
  font-family:'Vazirmatn',Tahoma,sans-serif;color:#fff;
  background:
    radial-gradient(ellipse 700px 500px at 25% 15%,rgba(0,102,255,.16),transparent 60%),
    radial-gradient(ellipse 620px 480px at 78% 82%,rgba(124,58,237,.15),transparent 60%),
    #050505;
}
.cube{width:84px;height:84px;margin-bottom:26px;filter:drop-shadow(0 0 26px rgba(0,102,255,.5))}
h1{font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.9}
p{color:var(--muted);font-size:15px;font-weight:300;line-height:2.1;margin-top:12px;max-width:430px}
.links{display:flex;gap:13px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.btn{
  padding:14px 28px;border-radius:14px;text-decoration:none;color:#fff;
  font-size:14.5px;font-weight:500;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  box-shadow:0 0 26px rgba(0,102,255,.3),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .3s,box-shadow .3s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 34px rgba(124,58,237,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.ghost{background:var(--glass);border:1px solid var(--glass-border);box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:#fff;border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
</style>
</head>
<body>
  <svg class="cube" viewBox="0 0 24 24" fill="none">
    <path d="M12 2 21 7v10l-9 5-9-5V7l9-5Z" stroke="#0066FF" stroke-width="1.2"/>
    <path d="M12 2v10m0 0 9-5m-9 5-9-5m9 5v10" stroke="#7C3AED" stroke-width=".9" opacity=".8"/>
  </svg>
  <h1>مستندات CubePay این‌جا نیست — منتقل شده.</h1>
  <p>در حال انتقال به مخزن مستندات هستید. اگر خودکار باز نشد، از دکمه زیر بروید.</p>
  <div class="links">
    <a class="btn" href="https://github.com/cubepy/cubepay-doc">رفتن به مستندات</a>
    <a class="btn ghost" href="/">صفحه اصلی</a>
  </div>
  <script>location.replace('https://github.com/cubepy/cubepay-doc');</script>
</body>
</html>
